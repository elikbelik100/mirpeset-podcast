name: Update podcast

on:
  schedule:
    - cron: "17 3 * * 0"        # every Sunday, ~05:17 Israel time
  workflow_dispatch:            # "Run workflow" button for manual runs
  push:
    paths: ["tags.yml", "config.yml"]   # re-tag right after you edit the rules

permissions:
  contents: write               # commit the feed + upload audio to Releases

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Build podcast
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python bot/build.py

      - name: Save results
        if: always()
        run: |
          git config user.name  "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add -A state docs reports
          git diff --cached --quiet || git commit -m "Podcast update $(date -u +%F)"
          git push
